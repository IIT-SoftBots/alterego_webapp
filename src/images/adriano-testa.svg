<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 5 112 106" role="img" aria-label="Adriano">
  <defs>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#e9ebef"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- head -->
  <ellipse cx="120" cy="58" rx="54" ry="50" fill="url(#head)" stroke="#d5d9df" stroke-width="1.5"/>
  <!-- speaker dots -->
  <g fill="#9aa0a8">
    <circle cx="104" cy="18" r="1.6"/><circle cx="112" cy="16" r="1.6"/><circle cx="120" cy="15" r="1.6"/><circle cx="128" cy="16" r="1.6"/><circle cx="136" cy="18" r="1.6"/>
    <circle cx="100" cy="25" r="1.6"/><circle cx="108" cy="23" r="1.6"/><circle cx="116" cy="22" r="1.6"/><circle cx="124" cy="22" r="1.6"/><circle cx="132" cy="23" r="1.6"/><circle cx="140" cy="25" r="1.6"/>
    <circle cx="112" cy="29" r="1.6"/><circle cx="120" cy="28" r="1.6"/><circle cx="128" cy="29" r="1.6"/>
  </g>
  <!-- eyebrows -->
  <rect x="88" y="40" width="22" height="6" rx="3" fill="#f7f7f8" stroke="#c9cdd3"/>
  <rect x="130" y="40" width="22" height="6" rx="3" fill="#f7f7f8" stroke="#c9cdd3"/>
  <!-- eyes -->
  <ellipse cx="99" cy="60" rx="10" ry="12" fill="#1f2a3a"/>
  <ellipse cx="141" cy="60" rx="10" ry="12" fill="#1f2a3a"/>
  <ellipse cx="96" cy="56" rx="3" ry="3.5" fill="#6b84a8" opacity=".7"/>
  <ellipse cx="138" cy="56" rx="3" ry="3.5" fill="#6b84a8" opacity=".7"/>
  <!-- LED mouth -->
  <path d="M100 80 Q120 94 140 80 Q138 89 120 92 Q102 89 100 80 Z" fill="#0f1a2a"/>
  <g filter="url(#glow)" stroke="#5fd0ff" stroke-width="2.2" stroke-linecap="round">
    <path d="M106 83v4 M110 84v5 M114 85v5 M118 85.5v5 M122 85.5v5 M126 85v5 M130 84v5 M134 83v4"/>
    <path d="M101 81 Q120 95 139 81" fill="none" stroke-width="2"/>
  </g>
</svg>
